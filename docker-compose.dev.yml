# Lokale Entwicklung komplett in Docker: App (next dev mit Hot Reload) auf http://localhost:3020 + Postgres.
# Eigener Projektname, damit nichts mit dem Deployment-Stack aus docker-compose.yml kollidiert.
# Start: docker compose -f docker-compose.dev.yml up -d   — siehe DEVELOPMENT.md
name: temgine-dev
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temgine
      POSTGRES_PASSWORD: temgine_dev # nur lokal, nicht für Produktion
      POSTGRES_DB: temgine_cms
    ports:
      - "127.0.0.1:5441:5432" # nur für Host-Werkzeuge (psql, prisma studio)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temgine -d temgine_cms"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    image: node:20-slim
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://temgine:temgine_dev@postgres:5432/temgine_cms
      NEXTAUTH_URL: http://localhost:3020
      NEXTAUTH_SECRET: dev-only-secret-change-me
      ALTCHA_HMAC_KEY: dev-only-altcha-key
      WATCHPACK_POLLING: "true" # Datei-Änderungen über den Windows-Bind-Mount erkennen
    ports:
      - "3020:3020"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # Linux-Binaries (sharp, prisma) getrennt von Windows-node_modules
      - next_cache:/app/.next-dev # Turbopack-Lockfile funktioniert nicht auf dem Windows-Bind-Mount
    command:
      - sh
      - -c
      - |
        apt-get update -y && apt-get install -y openssl >/dev/null
        npm install && npx prisma migrate deploy && npx next dev -p 3020
volumes:
  postgres_data:
  node_modules:
  next_cache:
