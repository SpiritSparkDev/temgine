# No explicit container_name / project name here on purpose: Compose derives both from the
# current directory by default, so container/network/volume names are automatically namespaced
# per checkout; app's ./data and ./public bind mounts (below) land inside that same checkout
# directory for the same reason. To run several isolated instances on one host, check out this
# repo into one directory per instance (or set COMPOSE_PROJECT_NAME explicitly).
#
# Every value the app needs is listed explicitly under app.environment below
# as ${...} — deliberately no env_file: here. env_file: needs an actual file
# on disk at a fixed path, which breaks under tools that manage the .env
# content themselves without writing that file where Compose expects it
# (e.g. Portainer's "load variables from .env" stack feature, or Plesk's
# Docker Stack Editor) — ${...} substitution is what those tools actually
# support. Supply the values via a real ".env" file for plain `docker compose
# up`, or via your tool's own environment-variables UI. See README ("Docker:
# benötigte Umgebungsvariablen") for what's needed; never commit real secrets.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER fehlt in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD fehlt in .env}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME fehlt in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres is always reachable under its service name on Compose's
      # internal network — unrelated to APP_PORT (that's only the host-side
      # port for reaching the app itself from outside).
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      NEXTAUTH_URL: ${PUBLIC_URL:?PUBLIC_URL fehlt in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET fehlt in .env}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY fehlt in .env}
      PORT: 3000
      # Optional — leer bleibt einfach ungesetzt, kein Fehlschlag
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      CONTACT_MAIL_TO: ${CONTACT_MAIL_TO:-}
      NEXT_PUBLIC_DEV_MODE: ${NEXT_PUBLIC_DEV_MODE:-}
      NEXT_PUBLIC_DEBUG_RENDER: ${NEXT_PUBLIC_DEBUG_RENDER:-}
      ROBOTS_DISALLOW: ${ROBOTS_DISALLOW:-}
      ROBOTS_CRAWL_DELAY: ${ROBOTS_CRAWL_DELAY:-}
      ROBOTS_REQUEST_RATE: ${ROBOTS_REQUEST_RATE:-}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    # Fixed, single host port on purpose (no range fallback): a reverse proxy
    # in front (Plesk, nginx, ...) needs a known, stable port to forward to.
    ports:
      - "${APP_PORT:?APP_PORT fehlt in .env}:3000"

volumes:
  postgres_data:
    driver: local
