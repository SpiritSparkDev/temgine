# No explicit container_name / project name here on purpose: Compose derives both from the
# current directory by default, so container/network/volume names (and the bind-mount paths
# below) are automatically namespaced per checkout. To run several isolated instances on one
# host, check out this repo into one directory per instance (or set COMPOSE_PROJECT_NAME
# explicitly) — see development_docs/DOCKER.md.
services:
  # Generates the Postgres password once on first start (or reuses the one
  # from .env.local's DATABASE_URL if set) and persists it into a volume both
  # postgres and app read from. Needed because Postgres must have the
  # password *before* it initializes — it can't generate its own.
  db-init:
    image: alpine:3
    env_file:
      - path: .env.local
        required: false
    command: >
      sh -c '
        set -e
        mkdir -p /secrets
        [ -f /secrets/db_password ] && exit 0
        if [ -n "$$DATABASE_URL" ]; then
          PASS=$$(echo "$$DATABASE_URL" | sed -E "s#.*://[^:]*:([^@]*)@.*#\1#")
        else
          PASS=$$(head -c 48 /dev/urandom | base64 | tr -dc "a-zA-Z0-9" | head -c 32)
        fi
        printf "%s" "$$PASS" > /secrets/db_password
        chmod 600 /secrets/db_password
      '
    volumes:
      - db_secrets:/secrets

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${DATABASE_USER:-temgine}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DATABASE_NAME:-temgine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-temgine}"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: ${DATABASE_USER:-temgine}
      DATABASE_NAME: ${DATABASE_NAME:-temgine}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      NEXTAUTH_URL: ${PUBLIC_URL:-http://localhost:${APP_PORT:-3000}}
      PORT: 3000
    volumes:
      - db_secrets:/run/secrets:ro
      - /srv/docker/${COMPOSE_PROJECT_NAME:-temgine}/temgine_data:/app/data
      - /srv/docker/${COMPOSE_PROJECT_NAME:-temgine}/temgine_public:/app/public
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
    driver: local
  db_secrets:
    driver: local
