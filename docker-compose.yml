services:
  postgres:
    image: postgres:15-alpine
    container_name: temgine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-temgine}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-temgine_dev}
      POSTGRES_DB: ${DATABASE_NAME:-temgine}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-temgine}"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: temgine-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      # Overrides the .env.local value: inside the compose network the DB
      # is reachable as "postgres", not "localhost".
      DATABASE_URL: postgres://${DATABASE_USER:-temgine}:${DATABASE_PASSWORD:-temgine_dev}@postgres:5432/${DATABASE_NAME:-temgine}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
